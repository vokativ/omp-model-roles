## OMP model-role export — comprehensive quota-aware allocation
## Generated: 2026-08-26 · Snapshot version: 14
## Stale? See research/RESEARCH-PLAYBOOK.md's staleness check before importing or re-deriving.
##
## v14: hardened + TESTED the v13 agent definitions (4 live dispatches, both agents resolved to
## anthropic/claude-opus-5). Added `thinking: high` to both and an `output:` JSON-schema to
## critical (machine-checkable GO/NO-GO verdict). Fixed repo-vs-installed drift: v13 shipped
## agents/*.md WITHOUT the hardening, so following the README would have downgraded a live
## install. NOTE: the agents' `tools:` allowlist is NOT a sandbox - MCP tools are injected
## regardless of it. Two open defects found by the agents auditing their own commit (critical
## and architect share a model; critical's first fallback collides with review/security/slow/
## plan) are documented but NOT fixed - they need a quota decision.
## See research/ARCHITECT-CRITICAL-AGENTS.md.
##
## v13: architect/critical were modelRoles-only through v12 - no bundled agent name existed to
## bind them to via task.agentModelOverrides, so they were unreachable except by manually
## switching the whole session (/model @architect, Ctrl+P). Added agents/architect.md and
## agents/critical.md (role-backed custom agent definitions) so both are now real task(agent=
## "architect"|"critical", ...) dispatch targets. See research/ARCHITECT-CRITICAL-AGENTS.md.
##
## v12: reverted v11's usageReservePct override. That 10 -> 5 change was a temporary
## experiment for one morning session, never meant to persist; this machine and this repo
## both go back to the schema default (10, unset) rather than declaring `usageReservePct: 10`
## explicitly, consistent with this file only stating retry.usage* keys that deviate from
## default.
##
## v10 changes (all driven by a measured head-to-head, see README.md "2026-08-25 A/B"):
##   - default's chain reordered: gpt-5.6-terra promoted to first fallback,
##     claude-sonnet-5 demoted from first to third (its 5h pool peaked at 94% over 30d).
##   - nvidia/meta/llama-3.1-8b-instruct REMOVED from all 12 chains. It has a 16K context
##     window; a measured first turn in this harness is 15.5K-26.7K tokens, so that entry
##     could never actually load. Replaced by nvidia/deepseek-ai/deepseek-v4-flash (1M ctx).
##
## Assumes these logins exist on the target machine:
##   - anthropic        (Claude Pro, $20/mo — the SCARCE pool, keep light, reserve for architect/critical)
##   - openai-codex      (ChatGPT Pro, $100/mo, 5x quota — the ABUNDANT pool, heavy roles & tiny work)
##   - google-antigravity (free preview; also proxies Claude models at no cost to the Anthropic pool)
##   - xai-oauth         (X Premium $8/mo bundled SuperGrok credits — small, weekly reset, use sparingly)
##   - nvidia             (free NIM catalog — unmetered last-resort fallback; use deepseek-v4-flash,
##                          NOT the small llama models, which cannot hold this harness's system prompt)
##   - openrouter         (prepaid credit balance — used ONLY as vision's first fallback; see
##                          models-overlay.yml for the required maxTokens override on that entry)

modelRoles:
  # --- Core Built-in Roles ---
  default: google-antigravity/gemini-3.7-flash
  smol: openai-codex/gpt-5.6-luna
  slow: openai-codex/gpt-5.6-sol
  plan: openai-codex/gpt-5.6-sol
  task: openai-codex/gpt-5.6-terra
  designer: xai-oauth/grok-4.6
  vision: google-antigravity/gemini-3.7-flash
  commit: xai-oauth/grok-build
  advisor: google-antigravity/claude-sonnet-4-6
  tiny: openai-codex/gpt-5.6-luna

  # --- Workflow, Review & Architecture Roles (Strategy C) ---
  architect: anthropic/claude-opus-5
  review: openai-codex/gpt-5.6-sol
  security: openai-codex/gpt-5.6-sol
  critical: anthropic/claude-opus-5
  fast_worker: openai-codex/gpt-5.6-luna
  good_worker: openai-codex/gpt-5.6-terra

task:
  agentModelOverrides:
    security-reviewer: "@security"
    reviewer: "@review"
    sonic: "@fast_worker"
    task: "@good_worker"

retry:
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-terra
      - nvidia/deepseek-ai/deepseek-v4-flash
      - anthropic/claude-sonnet-5
      - xai-oauth/grok-4.6
    smol:
      - google-antigravity/gemini-3.1-flash-lite
      - nvidia/deepseek-ai/deepseek-v4-flash
    slow:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.6
      - nvidia/deepseek-ai/deepseek-v4-flash
    plan:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.6
      - nvidia/deepseek-ai/deepseek-v4-flash
    task:
      - google-antigravity/gemini-3.7-flash
      - nvidia/deepseek-ai/deepseek-v4-flash
    designer:
      - openai-codex/gpt-5.6-terra
      - google-antigravity/gemini-3.7-flash
    vision:
      - openrouter/google/gemini-3.7-flash
      - openai-codex/gpt-5.6-terra
      - xai-oauth/grok-4.6
    commit:
      - openai-codex/gpt-5.6-luna
    advisor:
      - openai-codex/gpt-5.6-terra
    tiny:
      - nvidia/deepseek-ai/deepseek-v4-flash
      - xai-oauth/grok-composer-2.5-fast
      - google-antigravity/gemini-3.1-flash-lite
    architect:
      - openai-codex/gpt-5.6-sol
      - xai-oauth/grok-4.6
      - nvidia/deepseek-ai/deepseek-v4-flash
    review:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.6
      - nvidia/deepseek-ai/deepseek-v4-flash
    security:
      - anthropic/claude-opus-5
      - xai-oauth/grok-4.6
      - nvidia/deepseek-ai/deepseek-v4-flash
    critical:
      - openai-codex/gpt-5.6-sol
      - xai-oauth/grok-4.6
      - nvidia/deepseek-ai/deepseek-v4-flash
    fast_worker:
      - nvidia/deepseek-ai/deepseek-v4-flash
      - xai-oauth/grok-build
      - google-antigravity/gemini-3.1-flash-lite
    good_worker:
      - google-antigravity/gemini-3.7-flash
      - nvidia/deepseek-ai/deepseek-v4-flash
  usageAwareFallback: true
  usageReservePolicy: "auto"
