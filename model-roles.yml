## OMP model-role export — comprehensive quota-aware allocation
## Generated: 2026-11-14 · Snapshot version: 44
## Stale? See research/RESEARCH-PLAYBOOK.md's staleness check before importing or re-deriving.
## Version history and rationale per version: CHANGELOG.md.
##
## Assumes these logins exist on the target machine:
##   - anthropic        (Claude Max 5x, $100/mo — primary workhorse and depth pool: task/smol/slow/plan/security/sage; Haiku for tiny/commit/widget/sonic; Sonnet 5.5 also last default hop and first vision fallback)
##   - openai-codex      (ChatGPT Plus, $20/mo — critical + review primary (gpt-6.1-sol); first fallback in slow/plan/security/task and first fallback in vision; Luna in smol/tiny/commit/advisor)
##   - google-antigravity (Google AI Pro, ~$20/mo — no role or chain uses it since v44; only generate_image resolves models on its own)
##   - xai-oauth         (X Premium, $8/mo bundled SuperGrok credits — last-tier fallbacks; Grok Build/Composer end the cheap chains)
##   - mistral           (Mistral EDU/student Pro plan key via /login mistral — default primary GLM-5.3 (v38) plus fallback hops: smol/tiny GLM-5.3 Flash, task/review GLM-5.3, vision Large 4; no omp usage meter)
##   - typesafe          (API key with prepaid credit via /login typesafe — judge primary: typesafe/jev-1.14.0)
##   - openrouter        (API key with prepaid credit — judge fallbacks only: Jev via OpenRouter Decisions, then Liquid d1.1)

modelRoles:
  # --- Core Built-in Chat Roles ---
  default: mistral/zai-glm-5-3
  smol: anthropic/claude-sonnet-5-5
  slow: anthropic/claude-opus-5-5
  plan: anthropic/claude-opus-5-5
  task: anthropic/claude-sonnet-5-5
  vision: anthropic/claude-sonnet-5-5
  commit: anthropic/claude-haiku-5-5:low
  advisor: anthropic/claude-haiku-5-5:low
  tiny: anthropic/claude-haiku-5-5:low
  widget: anthropic/claude-haiku-5-5:low

  # --- Model-Kind Roles ---
  judge: typesafe/jev-1.14.0

  # --- Custom Workflow, Review & Architecture Roles ---
  review: openai-codex/gpt-6.1-sol
  security: anthropic/claude-sonnet-5-5
  critical: openai-codex/gpt-6.1-sol
  sage: anthropic/claude-fable-5-2
task:
  agentModelOverrides:
    security-reviewer: "@security"
    reviewer: "@review"
    sonic: "@tiny"

retry:
  fallbackChains:
    default:
      - anthropic/claude-sonnet-5-5
    smol:
      - mistral/zai-glm-5-3-flash
      - openai-codex/gpt-6-luna
      - xai-oauth/grok-build
    slow:
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
    plan:
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
    task:
      - openai-codex/gpt-6.1-sol
      - mistral/zai-glm-5-3
      - xai-oauth/grok-build
    vision:
      - openai-codex/gpt-6.1-sol
      - mistral/mistral-large-4
      - xai-oauth/grok-4.7
    commit:
      - openai-codex/gpt-6-luna
      - xai-oauth/grok-build
    advisor:
      - openai-codex/gpt-6-luna
      - xai-oauth/grok-build
    tiny:
      - mistral/zai-glm-5-3-flash
      - openai-codex/gpt-6-luna
      - xai-oauth/grok-composer-2.5-fast
    widget:
      - xai-oauth/grok-composer-2.5-fast
    judge:
      # Natives only: once a credentialed native judge fails, OMP never falls back to a prompted chat model.
      - openrouter/typesafe/jev-1.14
      - openrouter/typesafe/jev-1.13
      - openrouter/liquid/d1.1
    review:
      - xai-oauth/grok-4.7
      - mistral/zai-glm-5-3
    security:
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
    critical:
      - xai-oauth/grok-4.7
    sage:
      # Active only while sage's primary is Opus; a Fable primary uses the model-level chain below.
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
    # Model-level chains outrank role chains in OMP: with sage on Fable, THIS chain is sage's failover.
    anthropic/claude-fable-5-2:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
    anthropic/claude-fable-5-1:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
    anthropic/claude-fable-5:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6.1-sol
      - xai-oauth/grok-4.7
  usageAwareFallback: true
  usageReservePolicy: "auto"

cycleOrder:
  - smol
  - default
  - slow
  - sage

extendedContext: false
generate_image:
  enabled: true
defaultThinkingLevel: auto
update:
  auto: false

# GLM-5.3 keeps its 1M window with extendedContext off, so it still needs its own trigger (v38.1, v40).
# See research/MISTRAL-BUDGET-2026-11.md.
compaction:
  modelThresholds:
    mistral/zai-glm-5-3: "f150000"
