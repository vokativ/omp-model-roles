## OMP model-role export — quota-aware allocation
## Generated: 2026-08-15 · Snapshot version: 5
## Stale? See RESEARCH-PLAYBOOK.md's staleness check before importing or re-deriving.
##
## Assumes these logins exist on the target machine:
##   - anthropic        (Claude Pro, $20/mo — the SCARCE pool, keep light)
##   - openai-codex      (ChatGPT Pro, $100/mo, 5x quota — the ABUNDANT pool)
##   - google-antigravity (free preview; also proxies Claude models at no cost to the Anthropic pool)
##   - xai-oauth         (X Premium $8/mo bundled SuperGrok credits — small, weekly reset, use sparingly)
##   - nvidia             (free NIM catalog — unmetered last-resort fallback)

